services:
  backend:
    build:
      context: ./backend
    container_name: knowledge-rag-backend
    env_file:
      - ./backend/.env
    environment:
      QDRANT_URL: http://qdrant:6333
      
    ports:
      - "8000:8000"
    volumes:
      - ./backend/storage:/app/storage

  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: knowledge-rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
    - ./qdrant_storage:/qdrant/storage